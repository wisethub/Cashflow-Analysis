<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment & Cashflow Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:#0d1117;
  color:#e6edf3;
  min-height:100vh;
  padding:20px;
}

.ctrl-bar{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  padding:14px 16px;
  margin-bottom:18px;
  background:#161b22;
  border:1px solid #30363d;
  border-radius:12px;
}

.load-btn,.run-btn{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  color:#fff;
}

.load-btn{
  background:#238636;
}

.run-btn{
  background:#1f6feb;
}

.load-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.prog-wrap{
  flex:1;
  min-width:120px;
  height:6px;
  background:#30363d;
  border-radius:4px;
  overflow:hidden;
}

.prog-bar{
  height:100%;
  width:0%;
  background:#58a6ff;
  transition:width .25s;
}

.status-txt{
  font-size:12px;
  color:#8b949e;
}

.err-box{
  color:#f85149;
  background:#161b22;
  border:1px solid #30363d;
  border-radius:10px;
  padding:14px;
}

input[type="date"],select{
  background:#0d1117;
  border:1px solid #30363d;
  color:#e6edf3;
  padding:9px 10px;
  border-radius:8px;
  font-size:13px;
}

.grid{
  display:grid;
  gap:18px;
}

.kpi-grid{
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  margin-bottom:20px;
}

.card{
  background:#161b22;
  border:1px solid #30363d;
  border-radius:14px;
  padding:18px;
}

.card-title{
  font-size:13px;
  color:#8b949e;
  margin-bottom:10px;
  text-transform:uppercase;
}

.kpi-value{
  font-size:30px;
  font-weight:800;
}

.positive{
  color:#3fb950;
}

.negative{
  color:#f85149;
}

.warning{
  color:#d29922;
}

.chart-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
  gap:20px;
  margin-bottom:20px;
}

.chart-wrap{
  height:320px;
}

.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:16px;
}

.flex{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.flex-1{
  flex:1;
  min-width:320px;
}

.table-wrap{
  overflow:auto;
  border:1px solid #30363d;
  border-radius:10px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#21262d;
  padding:12px;
  text-align:left;
  font-size:12px;
}

td{
  padding:12px;
  border-top:1px solid #30363d;
  font-size:13px;
}

tr:hover td{
  background:#1c2128;
}

.alert-box{
  border-radius:10px;
  margin-bottom:12px;
  overflow:hidden;
  border:1px solid #30363d;
}

.alert-head{
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.alert-danger{
  background:rgba(248,81,73,.12);
}

.alert-warning{
  background:rgba(210,153,34,.12);
}

.alert-success{
  background:rgba(63,185,80,.12);
}

.alert-body{
  display:none;
  background:#0d1117;
  padding:12px;
}

.small{
  font-size:12px;
  color:#8b949e;
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  background:#21262d;
  color:#58a6ff;
  font-size:11px;
  margin-bottom:8px;
}

.empty-state{
  padding:60px 20px;
  text-align:center;
  background:#161b22;
  border:1px dashed #30363d;
  border-radius:12px;
  color:#8b949e;
}

.bank-balances{
  margin-top:14px;
}

.balance-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #30363d;
  font-size:13px;
}

@media(max-width:768px){
  .kpi-value{
    font-size:24px;
  }

  .chart-wrap{
    height:260px;
  }
}
</style>

</head>

<body>

<div class="ctrl-bar">

<button class="load-btn" id="load-btn" onclick="loadAllRecords()">⬇ Load All Records</button>

  <input type="date" id="start-date">
  <input type="date" id="end-date">

<button class="run-btn" onclick="applyFilters()">▶ Run Filter</button>

  <div class="prog-wrap">
    <div class="prog-bar" id="prog-bar"></div>
  </div>

  <span class="status-txt" id="status-txt">
    Press Load to fetch data
  </span>

</div>

<div id="app"></div>

<script>
/* ══════════════════════════════════
   GLOBAL STORAGE
══════════════════════════════════ */
let GLOBAL_DATA = null;

/* ══════════════════════════════════
   postMessage helper — DO NOT MODIFY
══════════════════════════════════ */
function postMessageWithResponse(message) {
  return new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      reject(new Error('Timeout — is this running inside Manager.io?'));
    }, 15000);
    function handler(event) {
      if (event.data?.type?.endsWith('-response') && event.data?.requestId === requestId) {
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        resolve(event.data.body);
      }
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ ...message, requestId }, '*');
  });
}

/* ══════════════════════════════════
   GL Pagination
══════════════════════════════════ */
async function getGeneralLedgerTransactionsBatch(onProgress) {
  const allItems = [];
  let nextToken  = null;
  let pageNum    = 0;
  let apiTotal   = null;

  do {
    const path = nextToken
      ? '/api4/general-ledger-transactions-batch?PageSize=99999&next_page_token=' + encodeURIComponent(nextToken)
      : '/api4/general-ledger-transactions-batch?PageSize=99999';

    const data = await postMessageWithResponse({ type: 'api-request', method: 'GET', path });

    const page = Array.isArray(data) ? data : (data.items || data.data || []);
    allItems.push(...page);

    nextToken = data.next_page_token || data.nextPageToken || data._links?.next?.href || null;

    if (apiTotal === null) {
      apiTotal = data.totalCount ?? data.total ?? data.count ?? data._metadata?.totalCount ?? null;
    }

    pageNum++;
    if (onProgress) onProgress(allItems.length, apiTotal, pageNum);
    if (pageNum >= 1000) break;

  } while (nextToken);

  return allItems;
}

/* ══════════════════════════════════
   Generic Pagination
══════════════════════════════════ */
async function fetchAllPages(endpoint){

  const allItems = [];
  let nextToken = null;
  let page = 0;

  do{

    const path = nextToken
      ? endpoint + '?PageSize=99999&next_page_token=' + encodeURIComponent(nextToken)
      : endpoint + '?PageSize=99999';

    const data = await postMessageWithResponse({
      type:'api-request',
      method:'GET',
      path
    });

    const rows = Array.isArray(data)
      ? data
      : (data.items || data.data || []);

    allItems.push(...rows);

    nextToken =
      data.next_page_token ||
      data.nextPageToken ||
      data._links?.next?.href ||
      null;

    page++;
    if(page >= 1000) break;

  }while(nextToken);

  return allItems;
}

/* ══════════════════════════════════
   MAIN LOAD
══════════════════════════════════ */
async function loadAllRecords(){

  const btn = document.getElementById('load-btn');
  const bar = document.getElementById('prog-bar');
  const status = document.getElementById('status-txt');

  btn.disabled = true;
  btn.textContent = 'Loading...';

  try{

    const glItems = await getGeneralLedgerTransactionsBatch((loaded,total,page)=>{
      status.textContent = `GL Page ${page} · ${loaded.toLocaleString()} loaded`;
    });

    bar.style.width = '30%';

    const bankAccounts = await fetchAllPages('/api4/bank-or-cash-account-batch');

    bar.style.width = '55%';

    const receipts = await fetchAllPages('/api4/receipt-batch');

    bar.style.width = '80%';

    const payments = await fetchAllPages('/api4/payment-batch');

    bar.style.width = '100%';

    GLOBAL_DATA = {
      glItems,
      bankAccounts,
      receipts,
      payments
    };

    status.textContent = '✓ Data loaded successfully';

    btn.disabled = false;
    btn.textContent = '↺ Reload';

    setDefaultDates();

    applyFilters();

  }catch(err){

    document.getElementById('app').innerHTML = `
      <div class="err-box">
        <strong>Error:</strong><br><br>
        ${err.message}
      </div>
    `;

    btn.disabled = false;
    btn.textContent = '↺ Retry';
  }
}

/* ══════════════════════════════════
   DATE HELPERS
══════════════════════════════════ */
function setDefaultDates(){

  const today = new Date();
  const start = new Date();

  start.setDate(today.getDate()-30);

  document.getElementById('start-date').value =
    start.toISOString().slice(0,10);

  document.getElementById('end-date').value =
    today.toISOString().slice(0,10);
}

function inRange(date,start,end){

  if(!date) return false;

  const d = new Date(date);
  const s = new Date(start);
  const e = new Date(end);

  s.setHours(0,0,0,0);
  e.setHours(23,59,59,999);

  return d >= s && d <= e;
}

function sumLines(lines){
  return (lines || []).reduce((a,b)=>a + Number(b?.amount || 0),0);
}

function fmt(v){
  return '₦' + Number(v || 0).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function fmtDate(v){
  if(!v) return '-';
  return new Date(v).toLocaleDateString();
}

/* ══════════════════════════════════
   APPLY FILTERS
══════════════════════════════════ */
function applyFilters(){

  if(!GLOBAL_DATA) return;

  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;

  const receipts = GLOBAL_DATA.receipts.filter(r=>
    inRange(r?.item?.date,start,end)
  );

  const payments = GLOBAL_DATA.payments.filter(p=>
    inRange(p?.item?.date,start,end)
  );

  render({
    receipts,
    payments,
    bankAccounts:GLOBAL_DATA.bankAccounts
  });
}

/* ══════════════════════════════════
   RENDER
══════════════════════════════════ */
function render(data){

  const app = document.getElementById('app');

  const receipts = data.receipts || [];
  const payments = data.payments || [];
  const bankAccounts = data.bankAccounts || [];

  if(!receipts.length && !payments.length){

    app.innerHTML = `
      <div class="empty-state">
        <h2>No Transactions Found</h2>
        <br>
        <p>No transactions exist within selected dates.</p>
      </div>
    `;

    return;
  }

  /* =========================
     TOTALS
  ========================= */

  const totalInflow =
    receipts.reduce((a,b)=>a + sumLines(b?.item?.lines),0);

  const totalOutflow =
    payments.reduce((a,b)=>a + sumLines(b?.item?.lines),0);

  /* =========================
     BANK BALANCES
  ========================= */

  const accountBalances = {};

  bankAccounts.forEach(a=>{
    accountBalances[a.key] = {
      name:a?.item?.name || 'Unknown',
      balance:0
    };
  });

  receipts.forEach(r=>{
    const acc = r?.item?.receivedIn;
    const amt = sumLines(r?.item?.lines);

    if(accountBalances[acc]){
      accountBalances[acc].balance += amt;
    }
  });

  payments.forEach(p=>{
    const acc = p?.item?.paidFrom;
    const amt = sumLines(p?.item?.lines);

    if(accountBalances[acc]){
      accountBalances[acc].balance -= amt;
    }
  });

  const totalBankBalance =
    Object.values(accountBalances)
      .reduce((a,b)=>a + b.balance,0);

  /* =========================
     PAYMENT ANALYSIS
  ========================= */

  let supplierPayments = 0;
  let expensePayments = 0;
  let loanPayments = 0;

  payments.forEach(p=>{

    const amt = sumLines(p?.item?.lines);

    if(p?.item?.supplier){
      supplierPayments += amt;
    }
    else if(
      (p?.item?.description || '')
        .toLowerCase()
        .includes('loan')
    ){
      loanPayments += amt;
    }
    else{
      expensePayments += amt;
    }
  });

  /* =========================
     EXPENSE ANALYSIS
  ========================= */

  const expenseBreakdown = {};

  payments.forEach(p=>{

    const key =
      p?.item?.description ||
      'Uncategorized';

    const amt = sumLines(p?.item?.lines);

    expenseBreakdown[key] =
      (expenseBreakdown[key] || 0) + amt;
  });

  /* =========================
     ALERTS WITH DRILLDOWN
  ========================= */

  const alerts = [];

  const unusualThreshold =
    payments.length
      ? totalOutflow / payments.length * 3
      : 0;

  const unusualPayments = payments.filter(p=>
    sumLines(p?.item?.lines) > unusualThreshold &&
    unusualThreshold > 0
  );

  if(totalBankBalance < 0){

    alerts.push({
      type:'danger',
      title:'Negative Cash Position',
      rows:Object.values(accountBalances)
        .filter(a=>a.balance < 0)
        .map(a=>({
          date:'-',
          ref:'-',
          desc:a.name,
          amount:a.balance
        }))
    });
  }

  if(unusualPayments.length){

    alerts.push({
      type:'warning',
      title:'Unusual Transactions',
      rows:unusualPayments.map(p=>({
        date:p?.item?.date,
        ref:p?.item?.reference,
        desc:p?.item?.description,
        amount:sumLines(p?.item?.lines)
      }))
    });
  }

  const unreconciled =
    payments.filter(p=>Number(p?.item?.cleared || 0) === 0);

  if(unreconciled.length){

    alerts.push({
      type:'warning',
      title:'Unreconciled Bank Items',
      rows:unreconciled.map(p=>({
        date:p?.item?.date,
        ref:p?.item?.reference,
        desc:p?.item?.description,
        amount:sumLines(p?.item?.lines)
      }))
    });
  }

  if(!alerts.length){

    alerts.push({
      type:'success',
      title:'No Financial Alerts',
      rows:[]
    });
  }

  /* =========================
     CASHFLOW TREND
  ========================= */

  const trendMap = {};

  receipts.forEach(r=>{

    const d = (r?.item?.date || '').slice(0,10);

    if(!trendMap[d]){
      trendMap[d] = {in:0,out:0};
    }

    trendMap[d].in += sumLines(r?.item?.lines);
  });

  payments.forEach(p=>{

    const d = (p?.item?.date || '').slice(0,10);

    if(!trendMap[d]){
      trendMap[d] = {in:0,out:0};
    }

    trendMap[d].out += sumLines(p?.item?.lines);
  });

  const trendLabels = Object.keys(trendMap).sort();

  app.innerHTML = `

    <div class="grid kpi-grid">

      <div class="card">
        <div class="card-title">Cash Inflow</div>
        <div class="kpi-value positive">
          ${fmt(totalInflow)}
        </div>
      </div>

      <div class="card">
        <div class="card-title">Cash Outflow</div>
        <div class="kpi-value negative">
          ${fmt(totalOutflow)}
        </div>
      </div>

      <div class="card">

        <div class="card-title">
          Net Cash Position
        </div>

        <div class="kpi-value ${totalBankBalance >= 0 ? 'positive':'negative'}">
          ${fmt(totalBankBalance)}
        </div>

        <div class="bank-balances">

          <select id="account-select" onchange="showAccountBalance()">

            <option value="">Select Bank/Cash Account</option>

            ${
              Object.entries(accountBalances)
                .map(([k,v])=>`
                  <option value="${k}">
                    ${v.name}
                  </option>
                `).join('')
            }

          </select>

          <div id="selected-balance" class="small" style="margin-top:10px">
            Select account to view balance
          </div>

        </div>

      </div>

      <div class="card">
        <div class="card-title">Bank & Cash Accounts</div>
        <div class="kpi-value">
          ${bankAccounts.length.toLocaleString()}
        </div>
      </div>

    </div>

    <div class="card" style="margin-bottom:20px">

      <div class="section-title">
        Financial Alerts
      </div>

      ${
        alerts.map((a,i)=>`

          <div class="alert-box">

            <div class="alert-head alert-${a.type}"
                 onclick="toggleAlert(${i})">

              <span>${a.title}</span>
              <span>▼</span>

            </div>

            <div class="alert-body" id="alert-body-${i}">

              ${
                a.rows.length
                  ? `
                    <div class="table-wrap">
                      <table>
                        <thead>
                          <tr>
                            <th>Date</th>
                            <th>Reference</th>
                            <th>Description</th>
                            <th>Amount</th>
                          </tr>
                        </thead>
                        <tbody>

                          ${
                            a.rows.map(r=>`
                              <tr>
                                <td>${fmtDate(r.date)}</td>
                                <td>${r.ref || '-'}</td>
                                <td>${r.desc || '-'}</td>
                                <td>${fmt(r.amount)}</td>
                              </tr>
                            `).join('')
                          }

                        </tbody>
                      </table>
                    </div>
                  `
                  : `
                    <div class="small">
                      No issues found.
                    </div>
                  `
              }

            </div>

          </div>

        `).join('')
      }

    </div>

    <div class="chart-grid">

      <div class="card">
        <div class="section-title">Cashflow Trend</div>
        <div class="chart-wrap">
          <canvas id="cashflowChart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Payment Category Analysis</div>
        <div class="chart-wrap">
          <canvas id="paymentChart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Expense Breakdown</div>
        <div class="chart-wrap">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>

    </div>

    <div class="flex">

      <div class="card flex-1">

        <div class="section-title">
          Expenses Analysis
        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>Expense Type</th>
                <th>Amount</th>
              </tr>
            </thead>

            <tbody>

              ${
                Object.entries(expenseBreakdown)
                  .sort((a,b)=>b[1]-a[1])
                  .slice(0,20)
                  .map(([k,v])=>`
                    <tr>
                      <td>${k}</td>
                      <td>${fmt(v)}</td>
                    </tr>
                  `).join('')
              }

            </tbody>

          </table>

        </div>

      </div>

      <div class="card flex-1">

        <div class="section-title">
          Payment Analysis
        </div>

        <div style="display:grid;gap:16px">

          <div>
            <div class="badge">Supplier Payments</div>
            <div class="kpi-value negative">
              ${fmt(supplierPayments)}
            </div>
          </div>

          <div>
            <div class="badge">Loan Payments</div>
            <div class="kpi-value warning">
              ${fmt(loanPayments)}
            </div>
          </div>

          <div>
            <div class="badge">Expense Payments</div>
            <div class="kpi-value">
              ${fmt(expensePayments)}
            </div>
          </div>

        </div>

      </div>

    </div>

  `;

  /* =========================
     CASHFLOW CHART
  ========================= */

  new Chart(
    document.getElementById('cashflowChart'),
    {
      type:'line',
      data:{
        labels:trendLabels,
        datasets:[
          {
            label:'Inflow',
            data:trendLabels.map(d=>trendMap[d].in),
            borderColor:'#3fb950',
            backgroundColor:'rgba(63,185,80,.1)',
            fill:true,
            tension:.3
          },
          {
            label:'Outflow',
            data:trendLabels.map(d=>trendMap[d].out),
            borderColor:'#f85149',
            backgroundColor:'rgba(248,81,73,.1)',
            fill:true,
            tension:.3
          }
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{
            labels:{ color:'#e6edf3' }
          }
        },
        scales:{
          x:{
            ticks:{ color:'#8b949e' },
            grid:{ color:'#30363d' }
          },
          y:{
            ticks:{ color:'#8b949e' },
            grid:{ color:'#30363d' }
          }
        }
      }
    }
  );

  /* =========================
     PAYMENT CHART
  ========================= */

  new Chart(
    document.getElementById('paymentChart'),
    {
      type:'doughnut',
      data:{
        labels:[
          'Supplier',
          'Loan',
          'Expense'
        ],
        datasets:[{
          data:[
            supplierPayments,
            loanPayments,
            expensePayments
          ],
          backgroundColor:[
            '#58a6ff',
            '#d29922',
            '#f85149'
          ]
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{
            labels:{ color:'#e6edf3' }
          }
        }
      }
    }
  );

  /* =========================
     EXPENSE CHART
  ========================= */

  const expenseEntries =
    Object.entries(expenseBreakdown)
      .sort((a,b)=>b[1]-a[1])
      .slice(0,8);

  new Chart(
    document.getElementById('expenseChart'),
    {
      type:'bar',
      data:{
        labels:expenseEntries.map(x=>x[0]),
        datasets:[{
          label:'Expenses',
          data:expenseEntries.map(x=>x[1]),
          backgroundColor:'#1f6feb'
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{
            labels:{ color:'#e6edf3' }
          }
        },
        scales:{
          x:{
            ticks:{ color:'#8b949e' },
            grid:{ color:'#30363d' }
          },
          y:{
            ticks:{ color:'#8b949e' },
            grid:{ color:'#30363d' }
          }
        }
      }
    }
  );

  /* =========================
     ACCOUNT BALANCE VIEWER
  ========================= */

  window.ACCOUNT_BALANCES = accountBalances;
}

/* ══════════════════════════════════
   ACCOUNT BALANCE DISPLAY
══════════════════════════════════ */
function showAccountBalance(){

  const key =
    document.getElementById('account-select').value;

  const div =
    document.getElementById('selected-balance');

  if(!key){

    div.innerHTML =
      'Select account to view balance';

    return;
  }

  const acc = window.ACCOUNT_BALANCES[key];

  div.innerHTML = `
    <strong>${acc.name}</strong><br>
    Balance:
    <span class="${acc.balance >=0 ? 'positive':'negative'}">
      ${fmt(acc.balance)}
    </span>
  `;
}

/* ══════════════════════════════════
   ALERT TOGGLE
══════════════════════════════════ */
function toggleAlert(i){

  const el =
    document.getElementById('alert-body-' + i);

  el.style.display =
    el.style.display === 'block'
      ? 'none'
      : 'block';
}
</script>
